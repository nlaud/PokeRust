[package]
name = "poke_rust"
version = "0.1.0"
edition = "2024"
# Cargo auto-registers every top-level benches/*.rs as its own bench target;
# bench_common.rs is a shared helper module (not a runnable bench) included by
# turn_speed.rs/battle_sweep.rs via `#[path]`, so auto-discovery must be off or
# it would try (and fail) to compile bench_common.rs as a harness-less bench.
autobenches = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
rand = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Plain-main benchmarks (no test harness); run with:
#   cargo bench --bench turn_speed
#   cargo bench --bench battle_sweep
[[bench]]
name = "turn_speed"
harness = false

[[bench]]
name = "battle_sweep"
harness = false

[[bench]]
name = "solver_speed"
harness = false
[[bench]]
name = "depth2_cost"
harness = false

[[bench]]
name = "doubles_probe"
harness = false

[[bench]]
name = "doubles_wallclock"
harness = false
