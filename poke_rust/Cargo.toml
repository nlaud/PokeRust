[package]
name = "poke_rust"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
rand = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }

# Plain-main benchmark (no test harness); run with: cargo bench --bench turn_speed
[[bench]]
name = "turn_speed"
harness = false